server:
  port: 3000

spring:
  application:
    name: courtroom-starter

  datasource:
    url: jdbc:postgresql://localhost:8888/courtroom
    username: courtroom
    password: courtroom
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, never "update"
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      # password: ""   # uncomment if you set one
  jwt:
    access-token-secret: ${JWT_ACCESS_TOKEN_SECRET:lksjfs98dfsET#%$G%$^G%T%$Gjlehk3kjh0s9df#$F#}
    refresh-token-secret: ${JWT_REFRESH_TOKEN_SECRET:lksjfs98dfsdkjsdf98sdf7sdfjlehk3kjh0s9df#$F#}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:300000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  security:
    forgot-password:
      method: recovery-code

logging:
  level:
    com.courtroom: DEBUG
    org.hibernate.SQL: DEBUG
