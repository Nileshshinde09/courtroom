version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: courtroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: courtroom
      POSTGRES_USER: courtroom
      POSTGRES_PASSWORD: courtroom
    ports:
      - "8888:5432"
    volumes:
      - courtroom_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: courtroom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  courtroom_pgdata:
